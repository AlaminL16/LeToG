<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alamin Ali — Profile | LeToG</title>
    <meta name="description" content="View Alamin Ali's LeToG profile, uploaded notes, downloads and community stats." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="profile.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body data-page="profile">
    <div id="site-nav"></div>

    <main class="container page-body">
      <header class="profile-header">
        <div class="profile-avatar-wrap">
          <img id="profileAvatar" class="avatar avatar-lg profile-avatar-image" src="" alt="Profile picture" hidden />
          <span id="profileAvatarFallback" class="avatar avatar-lg" aria-hidden="true">U</span>
        </div>
        <div class="profile-name-block">
          <h1 id="profileDisplayName">Your profile</h1>
          <p class="profile-bio" id="profileBioDisplay" hidden></p>
        </div>
        <a class="btn btn-secondary" href="edit-profile.html">Edit profile</a>
      </header>


      <div class="stat-row profile-overview-content">
        <a class="stat stat-link" href="#my-notes"><strong id="profileNoteCount">0</strong><span>Notes uploaded · View notes</span></a>
        <a class="stat stat-link" href="bookmarks.html"><strong id="bookmarkCount">0</strong><span>Bookmarks · View bookmarks</span></a>
      </div>

      <nav class="profile-tabs" aria-label="Profile sections">
        <a href="#overview-section" class="active">Overview</a>
        <a href="#my-notes">My Notes</a>
        <a href="bookmarks.html">Bookmarks</a>
        <a href="#followers-section">Followers</a>
        <a href="#following-section">Following</a>
        <a href="settings.html">Settings</a>
      </nav>

      <section class="section profile-overview-content" id="my-notes">
        <div class="section-head">
          <h2>My Notes</h2>
          <a class="btn-text" href="upload.html">Upload new</a>
        </div>
        <div class="grid grid-3" id="myNotes"></div>
      </section>

      <section class="section profile-panel" id="followers-section" hidden><div class="section-head"><h2>Followers <span id="followersCount">0</span></h2></div><div id="profileFollowers" class="member-posts"><p class="muted">Loading followers…</p></div></section>
      <section class="section profile-panel" id="following-section" hidden><div class="section-head"><h2>Following <span id="followingCount">0</span></h2></div><div id="profileFollowing" class="member-posts"><p class="muted">Loading following…</p></div></section>
    </main>
<div id="site-bottom-nav"></div>

    <script src="global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
