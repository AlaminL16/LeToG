<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Communities — LeToG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="community.css"></head>
<body data-page="community"><div id="site-nav"></div><main class="container community-wrap">
<header class="community-heading"><div><h1>Communities</h1></div></header>
<section id="communityDirectory" class="card"><h2>Find a community</h2><p class="muted small">Search by community name or category. Posts and files are visible only to members.</p><input id="communitySearch" class="community-search" type="search" placeholder="Search communities or categories…" aria-label="Search communities"><form id="createCommunityForm" class="community-create-form"><input id="newCommunityName" maxlength="80" placeholder="Community name" required><select id="newCommunityCategory" required><option value="">Choose a category</option><option>Physics</option><option>Mathematics</option><option>Computer Science</option><option>Engineering</option><option>Research</option><option>Exam Preparation</option><option>Study Group</option><option>Other</option></select><input id="newCommunityDescription" maxlength="240" placeholder="What is this community about?"><button class="btn btn-primary" type="submit">＋ Create community</button></form><p id="communityDirectoryStatus" class="muted" role="status"></p><div id="communityList" class="community-list"></div></section>
<section id="communityRoom" class="card" hidden><div class="community-room-head"><div><a href="community.html">← All communities</a><h2 id="roomName">Community</h2><p id="roomDescription" class="muted"></p></div><div class="community-room-head-actions"><button id="communitySettingsToggle" type="button" class="btn btn-secondary btn-sm" hidden>Community settings</button><button id="leaveRoom" type="button" class="btn btn-secondary btn-sm">Leave community</button></div></div>
<section id="communitySettingsPanel" class="community-settings-panel" hidden><h3>Community settings</h3><form id="communitySettingsForm" class="community-create-form"><label for="editCommunityName">Community name</label><input id="editCommunityName" maxlength="80" required><label for="editCommunityCategory">Category</label><select id="editCommunityCategory" required><option>Physics</option><option>Mathematics</option><option>Computer Science</option><option>Engineering</option><option>Research</option><option>Exam Preparation</option><option>Study Group</option><option>Other</option></select><label for="editCommunityDescription">Description</label><input id="editCommunityDescription" maxlength="240"><button class="btn btn-primary" type="submit">Save settings</button><p id="communitySettingsStatus" class="muted small" role="status"></p></form></section>
<div class="community-room-tabs"><button type="button" data-room-tab="posts" class="active">Posts & files</button><button type="button" data-room-tab="people">Members & invite</button></div>
<section id="roomPostsPanel"><form id="roomPostForm" class="community-create-form"><textarea id="roomPostText" maxlength="5000" placeholder="Share something with this community…"></textarea><input id="roomPostFile" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.txt"><button class="btn btn-primary" type="submit">Share with community</button><p id="roomPostStatus" class="muted small"></p></form><div id="roomPosts" class="community-feed"></div></section>
<section id="roomPeoplePanel" hidden><h3>Invite people</h3><p class="muted small">Share this link so another LeToG user can join, or add a member directly by name.</p><div class="invite-link-row"><input id="communityInviteLink" readonly aria-label="Community invite link"><button type="button" id="copyCommunityInvite" class="btn btn-secondary">Copy link</button></div><label for="communityMemberSearch">Add a LeToG user</label><input id="communityMemberSearch" type="search" placeholder="Search people by display name…"><div id="communityMemberResults" class="community-member-results"></div><p id="communityPeopleStatus" class="muted small" role="status"></p></section>
</section></main><div id="site-bottom-nav"></div>
<script src="global.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="community.js"></script></body></html>
