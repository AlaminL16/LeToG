<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeToG — Home</title>
    <meta
      name="description"
      content="Discover public study notes shared by learners on LeToG."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body data-page="home">
    <div id="site-nav"></div>

    <main>
      <div class="container page-body home-feed-page">
        <section class="home-feed-section" aria-label="Latest posts">
          <p id="feedStatus" class="feed-status" role="status" aria-live="polite"></p>
          <div class="uploaded-notes-feed" id="studyNotesFeed"></div>
        </section>
      </div>
    </main>

    <div id="site-bottom-nav"></div>

    <script src="global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="home.js"></script>
  </body>
</html>
